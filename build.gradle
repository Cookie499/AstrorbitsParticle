import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.4.21"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"astrorbitsparticle" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "astrorbitsparticle"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// 参数表达式求值，随模组以 jar-in-jar 分发
	implementation "net.objecthunter:exp4j:0.4.8"
	include "net.objecthunter:exp4j:0.4.8"
}

tasks.register('generateStyleDocs', JavaExec) {
	group = 'documentation'
	description = 'Generate docs/样式参数.md from the style declarations'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'net.astrorbits.style.StyleDocGenerator'
	args layout.projectDirectory.file('docs/样式参数.md').asFile.absolutePath
	dependsOn tasks.named('classes')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

def javaOutputDirs = files(
	layout.buildDirectory.dir('classes/java/main'),
	layout.buildDirectory.dir('classes/java/client'),
)

tasks.register('createJavaOutputDirs') {
	// 没有 Java 源码时 Gradle 不创建输出目录，Fabric Loader 会在开发环境警告类路径缺失
	outputs.upToDateWhen { false }
	doLast {
		javaOutputDirs.each { it.mkdirs() }
	}
}

tasks.named('classes') { dependsOn tasks.named('createJavaOutputDirs') }

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_25
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
def nmbMavenRepo = providers.gradleProperty("nmb_maven_repo").getOrElse(
	layout.buildDirectory.dir("maven-repo").get().asFile.absolutePath
)

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			// 只发布构建产物，不带依赖元数据，避免调用方解析 Minecraft 依赖
			artifact(tasks.named("jar"))
			artifact(tasks.named("sourcesJar")) {
				classifier = "sources"
			}
		}
	}

	repositories {
		maven {
			name = "nmbMaven"
			// 默认发到 build/maven-repo；用 -Pnmb_maven_repo=<路径> 直接发到 Maven 仓库的本地克隆
			url = uri(nmbMavenRepo)
		}
	}
}

tasks.register('updateGolden', JavaExec) {
	group = 'verification'
	description = 'Rewrite golden samples under golden/'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'net.astrorbits.style.GoldenSampler'
	args layout.projectDirectory.dir('golden').asFile.absolutePath, '--write'
	dependsOn tasks.named('classes')
}

tasks.register('verifyGolden', JavaExec) {
	group = 'verification'
	description = 'Compare style output against golden/'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'net.astrorbits.style.GoldenSampler'
	args layout.projectDirectory.dir('golden').asFile.absolutePath
	dependsOn tasks.named('classes')
}

tasks.named('check') { dependsOn tasks.named('verifyGolden') }
